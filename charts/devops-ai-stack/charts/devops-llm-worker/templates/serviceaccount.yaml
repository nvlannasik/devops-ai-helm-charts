{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devops-ai.serviceAccountName" . }}
  labels:
    {{- include "devops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-worker
  {{- $irsa := include "devops-ai.awsServiceAccountAnnotations" . }}
  {{- if or .Values.serviceAccount.annotations (trim $irsa) }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with (trim $irsa) }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- end }}
# No RBAC: this worker never talks to the Kubernetes API. Its world is SQS, the LLM
# endpoint, and GitHub.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
