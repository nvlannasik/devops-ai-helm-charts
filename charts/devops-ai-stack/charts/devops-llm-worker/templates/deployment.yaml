apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-ai.fullname" . }}
  labels:
    {{- include "devops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-worker
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "devops-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devops-ai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: llm-worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "devops-ai.podSpecCommon" . | nindent 6 }}
      containers:
        - name: llm-worker
          image: {{ include "devops-ai.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # No ports: nothing connects to this workload.
          env:
            {{- include "devops-ai.sqsEnv" . | nindent 12 }}
            {{- include "devops-ai.awsEnv" . | nindent 12 }}
            {{- include "devops-llm-worker.derivedEnv" . | nindent 12 }}
            {{- include "devops-ai.env" . | nindent 12 }}
          {{- $certMount := include "devops-ai.awsCertVolumeMount" . }}
          {{- $keyMount := include "devops-llm-worker.githubAppVolumeMount" . }}
          {{- if or .Values.extraVolumeMounts (trim $certMount) (trim $keyMount) }}
          volumeMounts:
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with (trim $certMount) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with (trim $keyMount) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
      {{- $certVolume := include "devops-ai.awsCertVolume" . }}
      {{- $keyVolume := include "devops-llm-worker.githubAppVolume" . }}
      {{- if or .Values.extraVolumes (trim $certVolume) (trim $keyVolume) }}
      volumes:
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with (trim $certVolume) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with (trim $keyVolume) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
