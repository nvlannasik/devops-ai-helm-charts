{{- if .Values.certificate.enabled }}
{{/*
An X.509 workload certificate for AWS IAM Roles Anywhere — the worker authenticates to
AWS with this instead of a static access key.

Requires cert-manager and the referenced issuer; this chart creates neither. If the
issuer does not exist, the Certificate stays pending and the Pod blocks on its volume.
*/}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "devops-ai.fullname" . }}-cert
  labels:
    {{- include "devops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-worker
spec:
  secretName: {{ .Values.certificate.secretName }}
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  commonName: {{ .Values.certificate.commonName | quote }}
  {{- with .Values.certificate.subject }}
  subject:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  privateKey:
    {{- toYaml .Values.certificate.privateKey | nindent 4 }}
  usages:
    {{- toYaml .Values.certificate.usages | nindent 4 }}
  issuerRef:
    name: {{ .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
    group: {{ .Values.certificate.issuerRef.group | default "cert-manager.io" }}
{{- end }}
