apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-ai.fullname" . }}
  labels:
    {{- include "devops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # ClusterIP by design. This server holds the cluster's read credentials and its write
  # tools; it has no business being reachable from outside. The agent calls it in-cluster.
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: main
      protocol: TCP
  selector:
    {{- include "devops-ai.selectorLabels" . | nindent 4 }}
