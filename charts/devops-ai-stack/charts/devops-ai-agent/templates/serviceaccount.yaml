{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devops-ai.serviceAccountName" . }}
  labels:
    {{- include "devops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The agent has no ClusterRole on purpose. Everything it learns about the cluster comes
# through the MCP server, which holds the only Kubernetes credentials in this stack.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
