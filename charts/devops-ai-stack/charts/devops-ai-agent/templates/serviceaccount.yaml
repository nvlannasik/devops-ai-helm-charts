{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devops-ai.serviceAccountName" . }}
  labels:
    {{- include "devops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- $irsa := include "devops-ai.awsServiceAccountAnnotations" . }}
  {{- if or .Values.serviceAccount.annotations (trim $irsa) }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with (trim $irsa) }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- end }}
# The agent has no ClusterRole on purpose. Everything it learns about the cluster comes
# through the MCP server, which holds the only Kubernetes credentials in this stack.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
