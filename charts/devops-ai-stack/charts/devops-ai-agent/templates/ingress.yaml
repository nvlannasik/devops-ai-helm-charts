{{- if .Values.ingress.enabled }}
{{- $fullName := include "devops-ai.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "devops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}
                # Defaults to the main port, so a host that only lists `path: /` reaches
                # the app rather than silently landing on the dashboard.
                port:
                  number: {{ .port | default $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
