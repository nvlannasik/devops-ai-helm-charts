apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-ai.fullname" . }}
  labels:
    {{- include "devops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "devops-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devops-ai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "devops-ai.podSpecCommon" . | nindent 6 }}
      containers:
        - name: agent
          image: {{ include "devops-ai.image" . }}
          {{- include "devops-ai.containerCommon" . | nindent 10 }}
          ports:
            - name: main
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if eq (.Values.env.DASHBOARD_ENABLED | toString) "true" }}
            - name: dashboard
              containerPort: {{ .Values.service.dashboardPort }}
              protocol: TCP
            {{- end }}
          env:
            # Derived, not configured: the agent and the MCP server are separate repos
            # that must agree on this address. Deriving it from the same values that
            # render the Service is what stops them drifting.
            - name: MCP_HTTP_URL
              value: {{ include "devops-ai.mcpUrl" . | quote }}
            {{- include "devops-ai.mcpAuthEnv" . | nindent 12 }}
            {{- include "devops-ai.sqsEnv" . | nindent 12 }}
            {{- include "devops-ai.backingServicesEnv" . | nindent 12 }}
            {{- include "devops-ai.env" . | nindent 12 }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
