# devops-ai-stack — umbrella values.
#
# Anything two services must AGREE on lives under `global:`. Set it once here and both
# sides read it. templates/_validate.tpl fails `helm template` if they ever disagree, so
# a mismatch is caught in CI rather than at 3am in a Slack thread.
#
# Anything only one service cares about lives under that service's own key.
#
# MCP is the exception, and a deliberate one: it is a contract between exactly two
# services, and it is configured under each of them — devops-ai-agent.mcp and
# devops-mcp-server.mcp — rather than here. That means the bearer token is written twice.
# templates/_validate.tpl compares the two copies and refuses to render when they differ,
# so what would otherwise be duplication-you-hope-about is duplication-that-is-checked.

global:
  sqs:
    # The agent writes LLM requests here; llm-worker reads them.
    requestQueue: "llm-request.fifo"
    # SHARED response queue: the worker writes replies, the agent routes them back by
    # requestId. One queue, both directions of the reply path.
    responseQueue: "llm-response.fifo"
    requestDlq: "llm-request-dlq.fifo"
    # Second contract, for the GitOps PR flow. Only used when the agent has
    # GITOPS_REMEDIATION_ENABLED=true.
    gitopsRequestQueue: "gitops-request.fifo"
    # The region these queues live in is global.aws.region — it is the same region the
    # credentials are for, so it is stated once, there.

  # How the agent and the worker authenticate to AWS, and where.
  #
  # One object because it is one decision: the two services meet on SQS, so they need the
  # same region and credentials for the same account. Split across both sides it was six
  # secretEnv entries and two env vars written twice, with nothing to compare them.
  aws:
    region: "ap-southeast-1"

    # HOW a workload gets credentials. This is rendered as AWS_AUTH_MODE, which
    # entrypoint.sh in the agent and the worker images dispatches on — the value here and
    # the four branches in that script are one contract, so this is an enum, not a set of
    # independent switches. The chart rejects any other value.
    #
    #   iam-anywhere      an X.509 workload certificate is exchanged for temporary
    #                     credentials. entrypoint.sh writes ~/.aws/config with a
    #                     credential_process calling aws_signing_helper, and REQUIRES the
    #                     three ARNs plus a readable cert — it exits before Node starts if
    #                     any is missing. Uses rolesAnywhere and certificate below.
    #   irsa              EKS. Set irsa.roleArn below and the chart annotates both
    #                     ServiceAccounts; the EKS pod-identity webhook then injects its
    #                     own projected token volume and the SDK reads that. It does NOT
    #                     need automountServiceAccountToken — that governs the default
    #                     kube-api token, a different volume — so these workloads keep it
    #                     off and hold no Kubernetes credentials.
    #   env               a static access key from a Secret. Local dev and CI. Uses
    #                     credentialsSecret below.
    #   instance-profile  EC2/ECS instance metadata. Nothing to configure.
    #
    # The image defaults to iam-anywhere when AWS_AUTH_MODE is unset; this chart always
    # states it, because that default fails closed on a cluster that meant to use IRSA.
    authMode: "iam-anywhere"

    # Only read when authMode is "iam-anywhere".
    rolesAnywhere:
      # ARNs come from a Secret you already have — they identify the account, not a
      # credential, but they do not belong in values.yaml either.
      configSecret:
        name: "aws-rolesanywhere-config"
        trustAnchorArnKey: "trust-anchor-arn"
        profileArnKey: "profile-arn"
        roleArnKey: "role-arn"

    # The certificate the exchange presents. Only read when authMode is "iam-anywhere".
    # Mounted by every workload that talks to AWS, which is why it is issued once here
    # rather than per subchart.
    certificate:
      # Off: mount a Secret that something else issues (the dev cluster does this).
      # On: this chart asks cert-manager for it, and issuerRef.name becomes required.
      create: false
      secretName: "workload-tls"
      mountPath: "/certs"
      name: ""          # defaults to <release>-aws-workload
      commonName: ""    # defaults to the release name
      issuerRef:
        name: ""
        kind: ClusterIssuer
      duration: "720h"
      renewBefore: "48h"
      privateKey:
        algorithm: RSA
        size: 2048
        rotationPolicy: Always
      usages:
        - digital signature
        - key encipherment
        - client auth

    # Only read when authMode is "env" — a static access key, for clusters without
    # cert-manager and for local testing. Required there: the mode names an access key
    # the workload does not otherwise have.
    credentialsSecret:
      name: ""
      accessKeyIdKey: "AWS_ACCESS_KEY_ID"
      secretAccessKeyKey: "AWS_SECRET_ACCESS_KEY"

    # Only read when authMode is "irsa": the default IAM role, for services that do not
    # name their own. Rendered as the eks.amazonaws.com/role-arn annotation.
    #
    # The role belongs to a ServiceAccount, so each service can carry its own —
    # devops-ai-agent.serviceAccount.roleArn and devops-llm-worker.serviceAccount.roleArn
    # win over this. Prefer those: the agent writes to SQS while the worker reads it and
    # also holds the GitHub credentials, so one role for both is the larger of the two
    # permission sets granted twice. This value is here for the case where that does not
    # matter yet.
    irsa:
      roleArn: ""

  # Whether this release also deploys Postgres and Redis, and what they are called.
  #
  # These live under global rather than beside the subchart values below because the
  # agent needs them: a subchart's templates can read only its own values plus global,
  # so a flag at the root would be invisible to it. Chart.yaml gates both dependencies
  # on these keys, and the agent's DB_HOST / REDIS_HOST are derived from them.
  #
  # Both OFF by default, and that default is deliberate: the cluster this stack was
  # built for already runs postgresql and redis as their own Flux HelmReleases, so
  # turning these on there would give it a second Postgres rather than a shared one.
  # Turn them on for a fresh cluster or a demo, where one `helm install` should produce
  # a working stack. With them off, set DB_HOST and REDIS_HOST in devops-ai-agent.env.
  postgresql:
    enabled: false
    # Only if you also set postgresql.fullnameOverride below; the two must agree, and
    # the chart checks that they do.
    fullnameOverride: ""
  redis:
    enabled: false
    fullnameOverride: ""

  # Applied to every workload in the stack.
  imagePullSecrets: []
  commonLabels: {}

# ---------------------------------------------------------------------------
# Services. Each key matches the subchart name in Chart.yaml dependencies.
# See each subchart's values.yaml for the full set.
# ---------------------------------------------------------------------------

devops-ai-agent:
  enabled: true

devops-mcp-server:
  enabled: true

devops-llm-worker:
  # Only needed when the agent has a private-llm backend, or when GitOps PR remediation
  # is on. Off by default: an agent on Claude or an OpenAI-compatible endpoint calls out
  # directly and never touches SQS.
  enabled: false

# ---------------------------------------------------------------------------
# Backing services — settings passed to the Bitnami subcharts.
#
# The on/off switch is NOT here, it is global.postgresql.enabled / global.redis.enabled
# above, so that the agent can see it too. Setting `postgresql.enabled` here instead is
# a no-op that would leave you with an agent configured for a Postgres nobody deployed,
# so the chart fails the render if it finds one.
# ---------------------------------------------------------------------------

postgresql:
  # The Bitnami chart creates a database only when auth.database is set, and only on
  # FIRST init of an empty volume. App migrations create tables, never the database
  # itself — so a volume that was initialised without this needs a manual CREATE
  # DATABASE. Validated at render time when global.postgresql.enabled is true.
  auth:
    database: "devops_agent"
    username: "postgres"
    existingSecret: ""
  architecture: standalone
  primary:
    persistence:
      enabled: true
      size: 8Gi

redis:
  architecture: standalone
  auth:
    enabled: true
    existingSecret: ""
    existingSecretPasswordKey: "redis-password"
  master:
    persistence:
      enabled: false   # conversation cache — losing it costs context, not data
