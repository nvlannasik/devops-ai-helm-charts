apiVersion: v2
name: devops-ai-stack
description: The DevOps AI incident-investigation stack — Slack agent, MCP tool server, and private-LLM SQS worker
type: application
version: 0.4.0
appVersion: "1.0.0"
keywords:
  - devops
  - incident-response
  - mcp
  - slack
home: https://github.com/nvlannasik/devops-ai-helm-charts
sources:
  - https://github.com/nvlannasik/devops-ai-agent
  - https://github.com/nvlannasik/devops-mcp-server
  - https://github.com/nvlannasik/llm-worker
maintainers:
  - name: nvlannasik
dependencies:
  # The three services live in charts/ as local subcharts. Their conditions let a
  # deployment run only the pieces it needs — an agent talking to a private LLM has
  # no use for llm-worker unless a private-llm backend is configured.
  - name: devops-ai-agent
    version: 0.1.0
    condition: devops-ai-agent.enabled
  - name: devops-mcp-server
    version: 0.1.0
    condition: devops-mcp-server.enabled
  - name: devops-llm-worker
    version: 0.2.0
    condition: devops-llm-worker.enabled

  # Backing services, off by default. The cluster this stack was built for already
  # runs postgresql and redis as their own Flux HelmReleases; turning these on there
  # would give it a second copy. They exist for fresh clusters and for `helm install`
  # demos, where one command should yield a working stack.
  #
  # The switch lives under global. deliberately: a subchart's templates can only read
  # its own values plus global, so `postgresql.enabled` at the root would be invisible
  # to the agent — which is the one workload that needs to know whether a Postgres was
  # deployed here and what to call it. templates/_validate.tpl catches the root form.
  - name: postgresql
    version: "16.7.27"
    repository: https://charts.bitnami.com/bitnami
    condition: global.postgresql.enabled
  - name: redis
    version: "20.13.4"
    repository: https://charts.bitnami.com/bitnami
    condition: global.redis.enabled
