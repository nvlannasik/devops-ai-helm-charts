# The dev cluster, expressed as chart values.
#
# This mirrors what gitops-devops-ai-manifest/apps/dev/applications/ deploys today, so it
# doubles as the migration reference: everything below already exists in that overlay as
# three separate HelmReleases with ~170 lines of extraEnvVars between them.
#
# Two things are deliberately NOT here:
#
#   - Secrets. Every credential is referenced by Secret name and key; this file only names
#     them. The Secrets themselves — devops-agent-secret, llm-api-key-secret,
#     github-token-secret, aws-rolesanywhere-config — are created outside this chart and
#     are expected to already exist in the namespace.
#
#   - The MCP token. It is in the dev overlay in cleartext, twice. Both services below
#     point at the same Secret key instead. MCP is configured per service, not under
#     global: the contract is between exactly those two, and the umbrella's
#     templates/_validate.tpl compares the two halves and refuses to render when they
#     disagree — which is what makes writing it twice safe.
#
# Install:
#   helm install devops-ai . -n devops-tools -f examples/values-dev.yaml

global:
  sqs:
    requestQueue: "llm-request.fifo"
    responseQueue: "llm-response.fifo"
    requestDlq: "llm-request-dlq.fifo"
    gitopsRequestQueue: "gitops-request.fifo"

  # Written once, rendered into both the agent and the worker: the ARNs, the region, and
  # the certificate mount. In the dev overlay this was three secretEnv entries and two
  # CERT_* vars per service, duplicated with nothing to compare them.
  aws:
    region: "ap-southeast-1"
    # Rendered as AWS_AUTH_MODE. entrypoint.sh dispatches on it — dev exchanges an X.509
    # workload cert for temporary credentials, so no access key exists anywhere here.
    authMode: "iam-anywhere"
    rolesAnywhere:
      configSecret:
        name: aws-rolesanywhere-config
    certificate:
      # dev mounts a cert issued outside this release rather than having cert-manager
      # issue one here.
      create: false
      secretName: workload-tls
      mountPath: /certs

  # dev runs its own postgresql and redis as separate Flux HelmReleases. Leave these off
  # and point the agent at them by hostname below.
  postgresql:
    enabled: false
  redis:
    enabled: false

devops-ai-agent:
  enabled: true
  image:
    tag: latest

  mcp:
    transport: "http"
    # MCP_HTTP_URL is derived from these, and checked against the mcp-server subchart's
    # own Service — the agent and the Service it dials cannot drift apart.
    serviceName: devops-mcp-server
    namespace: devops-tools
    port: 3000
    authTokenSecret:
      name: devops-agent-secret
      key: MCP_AUTH_TOKEN

  slack:
    alertChannel: "C09R0F6F891"
    oncallUsers: ["U03RCHDHUH5"]
    approverUsers: ["U0BGYRD1EPM"]
    existingSecret: devops-agent-secret

  alertWebhook:
    existingSecret: devops-agent-secret

  llm:
    provider: "router"
    # Order here IS the LLM_BACKEND_<N> index order, so the contiguity the agent's
    # registry demands comes free.
    backends:
      - name: haiku
        kind: claude
        model: claude-haiku-4-5
        existingSecret: devops-agent-secret
        apiKeyKey: CLAUDE_KEY
      - name: chatgpt
        kind: openai-compatible
        baseUrl: "https://api.openai.com/v1"
        model: gpt-5-nano-2025-08-07
        existingSecret: devops-agent-secret
        apiKeyKey: OPENAI_KEY
      - name: deepseek
        kind: openai-compatible
        baseUrl: "https://api.deepseek.com"
        model: deepseek-v4-flash
        existingSecret: devops-agent-secret
        apiKeyKey: DEEPSEEK_KEY
      - name: private-llm
        # kind private-llm takes the SQS path — the render fails if the worker is disabled,
        # and it carries no key here: llm-worker holds that one.
        kind: private-llm
    routes:
      heavy: [private-llm, chatgpt, haiku]
      light: [deepseek]
    sqs:
      timeoutSeconds: 240
      pollWaitSeconds: 20

  investigation:
    maxConcurrent: 5

  gitops:
    enabled: true
    timeoutSeconds: 240

  # External Postgres and Redis, not deployed by this release.
  database:
    host: "postgresql.postgresql"
    name: "devops_agent"
    username: "postgres"
    existingSecret: devops-agent-secret

  redis:
    enabled: true
    host: "devops-agent-redis.devops-tools"
    existingSecret: devops-agent-secret

  dashboard:
    enabled: true
    port: 3001
    existingSecret: devops-agent-secret

  # An override, not a restatement: the chart defaults to "prod". The agent compares this
  # string exactly — "dev" is what gets debug-level logging out of it on this cluster.
  env:
    NODE_ENV: "dev"

  # The AWS cert volume and its mount come from global.aws — only /tmp is local, because
  # the container filesystem is read-only.
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

devops-mcp-server:
  enabled: true
  image:
    tag: latest

  # The server's half of the same MCP contract: same Secret, same key as the agent above.
  mcp:
    transport: "http"
    authTokenSecret:
      name: devops-agent-secret
      key: MCP_AUTH_TOKEN

  kubernetes:
    authMode: "incluster"

  # This cluster's observability stack. Alertmanager is reached through Prometheus's own
  # alerts endpoint here, so it has no separate URL.
  prometheus:
    url: "http://monitoring-prometheus-server.monitoring"
  loki:
    url: "http://loki.monitoring.svc.cluster.local:3100"
  tracing:
    backend: "jaeger"
    url: "http://jaeger-query.observability.svc.cluster.local:16686"

  # The inner bound on remediation. rbac.allowWrite below is the outer one; the render
  # fails unless both agree.
  writeTools:
    enabled: true
    # flux-system is deliberately absent: the server refuses it whatever this list says,
    # so listing it only reads as permission that does not exist. Flux-managed workloads
    # are reached through flux_reconcile and the GitOps PR flow instead.
    allowedNamespaces:
      - dev-auth
      - nginx-ingress
      - default
      - monitoring
      - headlamp
      - sarang-tani
      - devops-tools
      - mqtt-broker
      - oauth2-proxy
    maxScaleDelta: 5

  # No env override: NODE_ENV defaults to "prod" now, which is what this service runs.

  rbac:
    create: true
    readOnly: true
    # Matches writeTools.enabled above. Turning on one without the other gives a server
    # that either refuses its own tools or is refused by the API server.
    allowWrite: true
    allowFluxReconcile: true

devops-llm-worker:
  # Required here: the agent has a private-llm backend, and GitOps remediation is on.
  enabled: true
  image:
    tag: latest
  llm:
    apiFormat: "openai"
    baseUrl: "https://api.openai.com/v1"
    model: "gpt-5-nano-2025-08-07"
    maxTokens: 16384
    # This model rejects max_tokens and wants max_completion_tokens.
    useMaxCompletionTokens: true
    existingSecret: llm-api-key-secret
    apiKeyKey: api-key
  sqs:
    pollWaitSeconds: 20
    maxMessages: 10
  gitops:
    enabled: true
    repo: "nvlannasik/gitops-devops-ai-manifest"
    branch: "main"
    apiUrl: "https://api.github.com"
    auth:
      tokenSecret:
        name: github-token-secret
        key: token
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
